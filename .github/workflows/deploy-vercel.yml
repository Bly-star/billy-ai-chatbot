name: Deploy to Vercel

on:
  push:
    branches: [ main, bly-star-solid-dollop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # If a VERCEL_TOKEN is provided, use the CLI to deploy.
          # Otherwise, rely on the Vercel GitHub App / integration to deploy automatically.
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel --prod --token "$VERCEL_TOKEN" --confirm
          else
            echo "No VERCEL_TOKEN provided — relying on Vercel GitHub Integration to deploy on push."
          fi
